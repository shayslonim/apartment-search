[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apartment-search"
version = "0.1.0"
description = "Score Facebook apartment listings received from Groups Watcher."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Apartment Search contributors" }
]
dependencies = []

[project.optional-dependencies]
facebook = [
  "playwright>=1.45.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5.0",
]

[project.scripts]
apartment-search = "apartment_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"
